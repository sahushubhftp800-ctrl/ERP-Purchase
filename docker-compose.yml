services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: erp_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: erp_purchase_system
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Auto-run SQL initialization scripts on first boot
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ERP Application Service (Backend API + React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_purchase_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: erp_purchase_system
      JWT_SECRET: super_secret_jwt_erp_purchase_order_2026_key_98741
      JWT_EXPIRES_IN: 7d
      TAX_RATE: 5.00
    ports:
      - "5000:5000"

volumes:
  db_data:
